# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Optional production Blueprint: create separately after staging verification.
# Creating it provisions paid resources and starts the initial deployment.
services:
  - type: web
    name: quizonebite-production
    runtime: docker
    branch: main
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    preDeployCommand: node scripts/db.mjs migrate
    healthCheckPath: /api/health/ready
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: quizonebite-production-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: quizonebite-production
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: quizonebite-production-db
    databaseName: quizonebite_production
    user: quizonebite_production
    postgresMajorVersion: "18"
    region: singapore
    plan: 0.5c-1g
    diskSizeGB: 5
    ipAllowList: []
