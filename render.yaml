# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Staging only. Creating this Blueprint provisions paid resources.
services:
  - type: web
    name: quizonebite-staging
    runtime: docker
    branch: develop
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    preDeployCommand: node scripts/db.mjs migrate
    healthCheckPath: /api/health/ready
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: quizonebite-staging-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: quizonebite-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: quizonebite-staging-db
    databaseName: quizonebite_staging
    user: quizonebite_staging
    postgresMajorVersion: "18"
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
