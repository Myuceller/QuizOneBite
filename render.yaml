# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free staging trial. Render's free PostgreSQL expires after 30 days.
services:
  - type: web
    name: quizonebite-staging
    runtime: docker
    branch: develop
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    # Free web services don't support preDeployCommand.
    dockerCommand: /bin/sh /app/scripts/start-render.sh
    healthCheckPath: /api/health/ready
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: quizonebite-staging-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: quizonebite-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: quizonebite-staging-db
    databaseName: quizonebite_staging
    user: quizonebite_staging
    postgresMajorVersion: "18"
    region: singapore
    plan: free
    ipAllowList: []
